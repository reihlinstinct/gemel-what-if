name: Accessibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pinned shared accessibility tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: reihlinstinct/repo-checks
          ref: 55f4c1155ef80421af0bf0cad2f296f2c3acd044
          path: .ci/repo-checks
          persist-credentials: false
      - name: Start synthetic local preview
        run: |
          node e2e/a11y.js preview > /tmp/zz-a11y-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if [ -f .a11y-routes.json ] && curl -fsS http://localhost:8765/fixture/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Synthetic preview failed to start'
          exit 1
      - uses: ./.ci/repo-checks/actions/a11y
        with:
          base-url: http://localhost:8765/
          config: ${{ github.workspace }}/.a11y-routes.json
      - name: Calculation and statement interaction states
        env:
          A11Y_TOOLS: ${{ github.workspace }}/.ci/repo-checks/actions/a11y
        run: node e2e/a11y.js
      - name: Scope summary
        if: always()
        run: |
          printf '%s\n' '## Accessibility pilot' 'Both catalog languages, Chromium/WebKit, desktop/mobile. Initial + calculation/statement states use synthetic data.' 'No conformance certification. Manual screen-reader/device checks remain open; indeterminate label checks require manual review.' >> "$GITHUB_STEP_SUMMARY"
