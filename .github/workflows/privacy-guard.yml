name: Privacy guard

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: reihlinstinct/repo-checks/actions/privacy@81f3dd292a8e7b7a5b2686f957dd7d6e2408b6f7 # reviewed public accessibility contact policy (#52)
        with:
          checkout-root: ${{ github.workspace }}
