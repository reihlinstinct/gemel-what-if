name: Privacy guard

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: reihlinstinct/repo-checks/actions/privacy@04e60256af9fa84cb134111217e5f20c19da87dd # reviewed public accessibility contact policy (#52)
        with:
          checkout-root: ${{ github.workspace }}
