name: Privacy guard

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: reihlinstinct/repo-checks/actions/privacy@aee03b060c7b844b28e9767d8634b87f82cb4896 # reviewed public accessibility contact policy (#52)
        with:
          checkout-root: ${{ github.workspace }}
