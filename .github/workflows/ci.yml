name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full suite: Sunday 06:00 Israel winter time (04:00 UTC;
    # runs 07:00 IDT in summer).
    - cron: '0 4 * * 0'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        run: |
          # Docs-only pull requests skip the heavy jobs; the Run summary gate
          # still runs and reports them as skipped.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tee /tmp/changed.txt
          # Doc-only allowlist: markdown, images, license and community
          # metadata. Anything else (including docs/ app code) runs the suite.
          if grep -qvEi '\.(md|markdown|rst|png|jpe?g|gif|svg|webp|ico)$|^LICENSE$|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE|CODEOWNERS|FUNDING\.yml)' /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm test
  e2e:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm run e2e
  e2e-webkit:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-webkit install --with-deps webkit
      - run: npm run e2e:webkit

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [changes, test, e2e, e2e-webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
      - name: Fail on failed or cancelled dependencies
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Deliberate docs-only skips are allowed; a failed or cancelled
          # dependency must fail this gate.
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("Dependencies failed or cancelled:", bad)
              sys.exit(1)
          print("All dependencies succeeded or were deliberately skipped.")
          PY
